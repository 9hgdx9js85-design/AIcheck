<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-icon" id="sidebar-toggle-btn" title="折叠侧边栏">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h2 class="sidebar-title">会话列表</h2>
            </div>
            <div class="sidebar-actions">
                <button class="btn-primary" id="new-chat-btn" title="新建会话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    新建会话
                </button>
                <button class="btn-icon" id="delete-all-btn" title="清空所有会话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M6 6v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索会话..." class="search-input">
            </div>
            <nav class="conversation-list" id="conversation-list">
                <!-- 会话列表动态生成 -->
            </nav>
            <div class="sidebar-footer">
                <button class="btn-icon" id="toggle-theme-btn" title="切换主题">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button class="btn-icon" id="settings-btn" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main class="main-content">
            <div class="chat-header">
                <h1 class="chat-title" id="chat-title">AI 聊天助手</h1>
                <div class="chat-header-actions">
                    <button class="btn-icon" id="export-btn" title="导出会话">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <line x1="7" y1="10" x2="12" y2="15"></line>
                            <line x1="12" y1="15" x2="17" y2="10"></line>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button class="btn-icon" id="scroll-top-btn" title="回到顶部" style="display:none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages">
                <!-- 消息动态生成 -->
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-container">
                <div class="input-options">
                    <label class="deep-think-toggle">
                        <input type="checkbox" id="deep-think-checkbox">
                        <span>深度思考</span>
                    </label>
                    <button class="btn-icon" id="upload-image-btn" title="上传图片">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                            <line x1="7" y1="2" x2="7" y2="22"></line>
                            <line x1="17" y1="2" x2="17" y2="22"></line>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <line x1="2" y1="7" x2="7" y2="7"></line>
                            <line x1="2" y1="17" x2="7" y2="17"></line>
                            <line x1="17" y1="17" x2="22" y2="17"></line>
                            <line x1="17" y1="7" x2="22" y2="7"></line>
                        </svg>
                    </button>
                    <input type="file" id="image-file-input" accept="image/*" style="display:none;" multiple>
                    <button class="btn-icon" id="clear-input-btn" title="清空输入">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <textarea id="message-input" placeholder="输入消息..." rows="1" class="chat-input"></textarea>
                <div class="input-actions">
                    <button class="btn-send" id="send-btn" title="发送">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- 图片预览模态框 -->
    <div id="image-modal" class="modal" style="display:none;">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-image">
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>高级设置</h2>
            <div class="settings-group">
                <label>模型温度 (Temperature)</label>
                <input type="range" id="temperature-slider" min="0" max="2" step="0.1" value="0.7">
                <span id="temperature-value">0.7</span>
            </div>
            <div class="settings-group">
                <label>最大Token数</label>
                <input type="number" id="max-tokens-input" min="1" max="4096" value="1024">
            </div>
            <div class="settings-group">
                <label>上下文记忆开关</label>
                <input type="checkbox" id="memory-toggle" checked>
            </div>
            <div class="settings-group">
                <label>自定义角色预设</label>
                <select id="role-preset-select">
                    <option value="">无预设</option>
                    <option value="你是一个有帮助的AI助手。">默认助手</option>
                    <option value="你是一个专业的编程导师。">编程导师</option>
                    <option value="你是一个创意写作专家。">创意作家</option>
                    <option value="你是一个严谨的数学老师。">数学老师</option>
                </select>
            </div>
            <div class="settings-group">
                <label>字号调节</label>
                <input type="range" id="font-size-slider" min="12" max="24" value="16">
                <span id="font-size-value">16px</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
