<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  AI Chat
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: #f7f8fa;
      color: #111827;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      color: #111827;
    }

    .balance {
      font-size: 14px;
      color: #6b7280;
    }

    /* 工具栏 */
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-secondary {
      height: 36px;
      padding: 0 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #374151;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #6b7280;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .status.error .status-dot {
      background: #ef4444;
    }

    /* 聊天区域 */
    .chat-container {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .message-wrap {
      display: flex;
      flex-direction: column;
    }

    .message-wrap.user {
      align-items: flex-end;
    }

    .message-wrap.assistant {
      align-items: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
    }

    .message.user {
      background: #2563eb;
      color: #ffffff;
    }

    .message.assistant {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #111827;
    }

    .message-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 6px;
      padding: 0 4px;
    }

    .loading {
      color: #6b7280;
      font-style: italic;
    }

    /* 输入区域 */
    .input-area {
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 16px 32px;
    }

    .input-wrap {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      outline: none;
      min-height: 56px;
      max-height: 180px;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .btn-primary {
      height: 56px;
      width: 56px;
      border-radius: 12px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">AI Chat</div>
    <div class="balance">账户余额: <span id="balance">正常</span></div>
  </div>

  <div class="toolbar">
    <button class="btn-secondary" id="checkBtn">检测连接</button>
    <div class="status" id="status">
      <div class="status-dot"></div>
      <span id="statusText">等待连接</span>
    </div>
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
      <button class="btn-primary" id="sendBtn">发送</button>
    </div>
  </div>

  <script>
    // ======================================
    // ⚠️ 这里改成你自己的 Worker 地址！
    // ======================================
    const WORKER_URL = "https://你的Worker名称.你的用户名.workers.dev";

    // DOM 元素
    const chatContainer = document.getElementById('chatContainer');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const checkBtn = document.getElementById('checkBtn');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const balanceEl = document.getElementById('balance');

    // 初始化
    init();

    function init() {
      // 自动检测连接
      checkConnection();
      
      // 自动调整输入框高度
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 180) + 'px';
      });

      // 发送按钮事件
      sendBtn.addEventListener('click', sendMessage);
      
      // 回车发送
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // 检测连接按钮
      checkBtn.addEventListener('click', () => {
        statusText.textContent = '检测中...';
        checkConnection();
      });
    }

    // 检测连接（真实可用，不是摆设）
    async function checkConnection() {
      try {
        const res = await fetch(WORKER_URL, { method: 'OPTIONS' });
        if (res.ok) {
          statusEl.classList.remove('error');
          statusText.textContent = '连接正常';
          balanceEl.textContent = '正常';
        } else {
          throw new Error('响应异常');
        }
      } catch (e) {
        statusEl.classList.add('error');
        statusText.textContent = '连接失败';
        balanceEl.textContent = '未知';
      }
    }

    // 添加消息到界面
    function addMessage(content, role) {
      const wrap = document.createElement('div');
      wrap.className = `message-wrap ${role}`;

      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = content;

      const time = document.createElement('div');
      time.className = 'message-time';
      time.textContent = new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });

      wrap.appendChild(msg);
      wrap.appendChild(time);
      chatContainer.appendChild(wrap);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return wrap;
    }

    // 发送消息
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      // 禁用按钮
      sendBtn.disabled = true;
      
      // 添加用户消息
      addMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';

      // 加载中
      const loading = addMessage('正在处理请求...', 'assistant');

      try {
        // 请求API
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'Qwen/Qwen3-8B',
            messages: [{ role: 'user', content: text }],
            temperature: 0.7,
            max_tokens: 2048,
            stream: false
          })
        });

        // 解析响应
        const data = await res.json();

        // 移除加载
        loading.remove();

        if (data.error) {
          addMessage('错误: ' + data.error, 'assistant');
        } else {
          const reply = data.choices?.[0]?.message?.content || '无响应内容';
          addMessage(reply, 'assistant');
        }

      } catch (e) {
        loading.remove();
        addMessage('请求失败: ' + e.message, 'assistant');
      } finally {
        sendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
